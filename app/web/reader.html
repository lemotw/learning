<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講義</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f1117">
<script src="pwa.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/highlight-github-dark.min.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
</head>
<body>
<div class="topbar">
  <a id="homeLink" href="./">⌂ <span class="nav-label">學習中心</span></a>
  <button id="courseViewToggle" hidden>🧭 <span class="nav-label">課程導覽</span></button>
  <span id="crumb" class="dim crumb"><a id="courseLink"></a><span id="unitCrumb"></span></span>
  <span id="archiveBadge" class="badge archived" hidden>已封存 · 唯讀</span>
  <span class="spacer"></span>
  <button id="prevBtn">‹ 上一</button>
  <button id="nextBtn">下一 ›</button>
  <button id="chatToggle">💬 <span class="nav-label">助教</span></button>
</div>

<div class="layout">
  <aside class="coursepanel collapsed" id="coursepanel">
    <header>
      <div><b>課程導覽</b><div id="courseViewTitle" class="dim"></div></div>
      <span class="spacer"></span>
      <button id="courseViewClose" title="關閉">✕</button>
    </header>
    <div id="courseViewHost" class="course-view-host"></div>
  </aside>

  <div class="content">
    <article id="md" class="md"></article>
    <section id="activities" class="md activity-section" style="padding-top:0"></section>
    <section id="selfcheck" class="md" style="padding-top:0"></section>
  </div>

  <aside class="chatpanel collapsed" id="chatpanel">
    <header>
      <b>單元助教</b>
      <span class="dim chat-sub">知道你的診斷弱點與本單元內容</span>
      <span class="spacer"></span>
      <button id="chatFull" title="切換全螢幕">⤢ 全螢幕</button>
      <button id="newChat" title="開新對話">＋新對話</button>
      <button id="chatClose" title="關閉">✕</button>
    </header>
    <div class="chatbar" id="chatBar" hidden>
      <select id="agentPick" title="選擇助教 agent"></select>
      <select id="modelPick" title="選擇模型"></select>
      <span class="dim" id="agentNote"></span>
    </div>
    <!-- 歷史對話自己一列:三個 select 塞不進 380px 側欄扣掉 padding 的 352px -->
    <div class="chatbar" id="sessRow" hidden>
      <select id="sessPick" title="切換歷史對話"></select>
      <span class="dim" id="sessNote"></span>
    </div>
    <div class="chatlog" id="chatlog"></div>
    <div class="chatinput">
      <textarea id="chatText" placeholder="問這份講義的任何問題…(Enter 送出,Shift+Enter 換行)"></textarea>
      <button class="primary" id="chatSend">送出</button>
    </div>
  </aside>
</div>

<script>
const qs = new URLSearchParams(location.search);
const course = qs.get('course'), unit = qs.get('unit');
const mdi = window.markdownit({ html: false, linkify: true, breaks: false,
  highlight: (str, lang) => {
    if (lang === 'mermaid') return '<div class="mermaid">' + str.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>';
    if (lang && hljs.getLanguage(lang)) { try { return hljs.highlight(str, { language: lang }).value; } catch {} }
    return '';
  }});
mermaid.initialize({ startOnLoad: false, theme: 'dark' });

let unitData = null;
let OFFLINE = false; // SW 回快取(X-Sw-Cache: hit)= 連不上 Mac
const VIEW_PROTOCOL = 1;
const viewInstances = new Map(); // iframe.contentWindow → instance
let courseActivitiesPromise = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (PWA.fromCache(r)) setOffline();
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.status);
  return r.json();
}

const isArchived = () => unitData && unitData.courseStatus === 'archived';

function applyArchiveUI() {
  if (!isArchived()) return;
  const badge = document.getElementById('archiveBadge');
  badge.hidden = false;
  document.querySelectorAll('.unit-state-bar [data-state]').forEach(b => {
    b.disabled = true; b.title = '課程已封存，請先還原才能修改進度';
  });
  const send = document.getElementById('chatSend');
  const ta = document.getElementById('chatText');
  send.disabled = true; send.title = '課程已封存，請先還原才能詢問助教';
  ta.disabled = true; ta.placeholder = '課程已封存，請先還原才能詢問助教';
  document.getElementById('newChat').disabled = true;
  agentPick.disabled = true; modelPick.disabled = true;
  document.querySelectorAll('#selfcheck textarea, #selfcheck button.primary, .activity-control').forEach(el => {
    el.disabled = true; el.title = '課程已封存，請先還原才能修改';
  });
  document.querySelectorAll('#selfcheck .result').forEach(r => {
    if (!r.textContent) r.textContent = '課程已封存，可查看歷次作答';
  });
}

function setOffline() {
  if (!OFFLINE) {
    OFFLINE = true;
    const b = document.createElement('span');
    b.className = 'badge offline';
    b.textContent = '離線';
    document.getElementById('crumb').after(b);
  }
  applyOfflineUI();
}

// 冪等;selfcheck 卡片是非同步長出來的,長完後需要再跑一次
function applyOfflineUI() {
  document.querySelectorAll('.unit-state-bar [data-state]').forEach(b => {
    b.disabled = true; b.title = '離線,需連上 Mac';
  });
  const send = document.getElementById('chatSend');
  send.disabled = true; send.title = '離線,需連上 Mac';
  const ta = document.getElementById('chatText');
  ta.disabled = true; ta.placeholder = '離線,需連上 Mac 才能使用助教';
  document.querySelectorAll('#selfcheck button.primary, .activity-control').forEach(b => {
    b.disabled = true; b.title = '離線,需連上 Mac';
  });
  broadcastView({ type: 'view:writable', writable: false });
  document.querySelectorAll('#selfcheck .result').forEach(r => {
    if (!r.textContent) r.textContent = '離線,需連上 Mac 才能批改';
  });
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load() {
  unitData = await api(`api/unit?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}`);
  document.title = unitData.courseTitle + ' · ' + unit;
  const courseLink = document.getElementById('courseLink');
  courseLink.textContent = unitData.courseNavTitle || unitData.courseTitle;
  courseLink.href = isArchived() ? `./#/archive/${encodeURIComponent(course)}` : `./#/c/${encodeURIComponent(course)}`;
  const unitLabel = unit.replace(/\.md$/, '').replace(/^(\d+)-/, '$1 ').replaceAll('-', ' ')
    .replace(/\b[a-z]/g, c => c.toUpperCase());
  document.getElementById('unitCrumb').textContent = ` / ${unitLabel}`;
  const mdEl = document.getElementById('md');
  mdEl.innerHTML = mdi.render(unitData.md);
  installUnitStateBar(mdEl);
  setupCourseDrawer();
  mountViews(mdEl);
  mermaid.run({ querySelector: '#md .mermaid' }).catch(()=>{});
  // $$ 數學式(fundamental-analysis 等課程使用)
  if (window.renderMathInElement) renderMathInElement(mdEl, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '\\(', right: '\\)', display: false },
    ],
    throwOnError: false,
  });
  // 講義內的相對 .md 連結改走 reader
  mdEl.querySelectorAll('a[href$=".md"]').forEach(a => {
    const href = a.getAttribute('href');
    if (/^https?:/.test(href)) return;
    const file = href.split('/').pop();
    a.href = `reader.html?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(file)}`;
  });
  installReadingFeedback(mdEl);
  renderStateButtons(unitData.state);
  setupNav();
  renderActivities();
  renderSelfcheck().then(applyArchiveUI);
  applyArchiveUI();
  // 選單要先建好,loadChatHistory 才有辦法把它還原成該段對話用的 agent
  loadAgents().then(loadChatHistory);
}

function installUnitStateBar(root) {
  const heading = root.querySelector('h1');
  if (!heading) return;
  const bar = document.createElement('div');
  bar.className = 'unit-state-bar';
  bar.innerHTML = `<span class="dim">本單元：</span>
    <button data-state="unread">未讀</button>
    <button data-state="reading">閱讀中</button>
    <button data-state="done">完成</button>`;
  heading.after(bar);
}

// 只在目前頁面的 DOM 保存段落狀態；不修改 Markdown，也不呼叫 API。
function installReadingFeedback(root) {
  const nodes = [...root.children];
  const sections = [];
  let section = null;

  function begin(node, kind, title) {
    section = document.createElement('section');
    section.className = `reading-block reading-block-${kind}`;
    section.dataset.readingState = 'unread';
    section.dataset.title = title;
    const marker = document.createElement('button');
    marker.type = 'button';
    marker.className = 'reading-block-marker';
    marker.innerHTML = '<span aria-hidden="true">○</span>';
    root.insertBefore(section, node);
    section.append(marker, node);
    sections.push(section);
    paintReadingBlock(section);
  }

  for (const node of nodes) {
    if (node.matches('h1, .unit-state-bar')) { section = null; continue; }
    if (node.matches('h2, h3')) {
      begin(node, node.tagName.toLowerCase(), node.textContent.trim() || '本節');
    } else if (!section) {
      begin(node, 'intro', '導言');
    } else {
      section.append(node);
    }
  }
  if (!sections.length) return;

  const hint = document.createElement('div');
  hint.className = 'reading-feedback-hint';
  hint.textContent = '雙點右側內容或圓點：閱讀中 → 完成；長按／拖曳仍可複製文字';
  (root.querySelector('.unit-state-bar') || root.querySelector('h1'))?.after(hint);

  // 連結與真正的控制元件不攔；code／pre／table 仍可雙點，拖曳或長按選字則照常。
  const interactive = 'a, button, input, select, textarea, img, svg, .mermaid, .course-view-shell';
  function blockAt(target) {
    if (!(target instanceof Element)) return null;
    const nativeHaptic = target.closest('.reading-ios-haptic');
    if (nativeHaptic) return nativeHaptic.closest('.reading-block');
    const marker = target.closest('.reading-block-marker');
    if (marker) return marker.closest('.reading-block');
    if (target.closest(interactive)) return null;
    return target.closest('.reading-block');
  }

  // iOS 沒有 Vibration API。Safari 17.4 起，使用者親自切換原生 switch control
  // 會產生 Taptic 回饋；第一下點擊後短暫把透明 switch 放到觸點，讓第二下是原生操作。
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const doubleTapWindow = 540;
  let iosHaptic = null;
  let iosHapticTimer = null;
  function clearIOSHaptic() {
    clearTimeout(iosHapticTimer);
    iosHaptic?.remove();
    iosHaptic = null;
  }
  function armIOSHaptic(block, clientX, clientY) {
    if (!isIOS || block.dataset.readingState === 'done') return;
    clearIOSHaptic();
    const size = 88;
    const control = document.createElement('input');
    control.type = 'checkbox';
    control.setAttribute('switch', '');
    control.setAttribute('aria-hidden', 'true');
    control.tabIndex = -1;
    control.className = 'reading-ios-haptic';
    control.style.left = `${Math.max(0, Math.min(innerWidth - size, clientX - size / 2))}px`;
    control.style.top = `${Math.max(0, Math.min(innerHeight - size, clientY - size / 2))}px`;
    block.prepend(control);
    iosHaptic = control;
    iosHapticTimer = setTimeout(clearIOSHaptic, doubleTapWindow);
  }

  let touchStart = null;
  let previousTap = null;
  let suppressDoubleClickUntil = 0;

  root.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse') return;
    const block = blockAt(event.target);
    if (event.target instanceof Element && event.target.matches('.reading-ios-haptic')) {
      // 第二下已落在 switch；暫停逾時計時，等 pointerup 完成原生 haptic。
      clearTimeout(iosHapticTimer);
    }
    touchStart = block && block.dataset.readingState !== 'done' ? {
      id: event.pointerId, block, x: event.clientX, y: event.clientY, at: performance.now(),
    } : null;
  }, { passive: true });

  root.addEventListener('pointerup', event => {
    if (!touchStart || touchStart.id !== event.pointerId) return;
    const start = touchStart;
    touchStart = null;
    const now = performance.now();
    if (now - start.at > 320 || Math.hypot(event.clientX - start.x, event.clientY - start.y) > 14) {
      previousTap = null;
      clearIOSHaptic();
      return;
    }
    if (previousTap && previousTap.block === start.block
      && start.at - previousTap.at < doubleTapWindow
      && Math.hypot(event.clientX - previousTap.x, event.clientY - previousTap.y) < 44) {
      const usedNativeHaptic = event.target instanceof Element
        && event.target.matches('.reading-ios-haptic');
      // iPhone 的原生 switch 必須完成真實的預設 click 才會震動，不能 preventDefault。
      if (!usedNativeHaptic) event.preventDefault();
      advanceReadingBlock(start.block);
      previousTap = null;
      suppressDoubleClickUntil = performance.now() + 700;
      setTimeout(clearIOSHaptic, 80);
    } else {
      previousTap = { block: start.block, x: event.clientX, y: event.clientY, at: now };
      const pendingTap = previousTap;
      // 等第一下的原生 click 完整結束後才放入 switch，避免第一下就誤觸 haptic。
      setTimeout(() => {
        if (previousTap === pendingTap) armIOSHaptic(start.block, event.clientX, event.clientY);
      }, 0);
    }
  }, { passive: false });

  root.addEventListener('pointercancel', () => {
    touchStart = null;
    previousTap = null;
    clearIOSHaptic();
  });

  root.addEventListener('dblclick', event => {
    if (performance.now() < suppressDoubleClickUntil) { event.preventDefault(); return; }
    const block = blockAt(event.target);
    if (!block) return;
    const marker = event.target instanceof Element && event.target.closest('.reading-block-marker');
    const selectingText = !marker && Boolean(window.getSelection()?.toString().trim());
    // 雙擊文字時同時更新區塊，但不阻止瀏覽器的選字／複製；圓點與空白才取消預設行為。
    if (!selectingText) event.preventDefault();
    advanceReadingBlock(block);
  });

  root.addEventListener('keydown', event => {
    if (!['Enter', ' '].includes(event.key) || !(event.target instanceof Element)) return;
    const marker = event.target.closest('.reading-block-marker');
    if (!marker) return;
    event.preventDefault();
    advanceReadingBlock(marker.closest('.reading-block'));
  });
}

function paintReadingBlock(block) {
  const state = block.dataset.readingState || 'unread';
  const icon = { unread: '○', reading: '◐', done: '✓' }[state];
  const label = { unread: '未開始', reading: '閱讀中', done: '完成' }[state];
  block.classList.toggle('is-reading', state === 'reading');
  block.classList.toggle('is-done', state === 'done');
  const marker = block.querySelector(':scope > .reading-block-marker');
  marker.querySelector('span').textContent = icon;
  marker.title = `${block.dataset.title} · ${label}`;
  marker.setAttribute('aria-label', `${block.dataset.title}：${label}`);
}

function advanceReadingBlock(block) {
  const state = block.dataset.readingState || 'unread';
  const next = state === 'unread' ? 'reading' : state === 'reading' ? 'done' : null;
  if (!next) return;
  block.dataset.readingState = next;
  paintReadingBlock(block);
  block.animate?.(
    [{ boxShadow: '0 0 0 0 rgba(124,111,240,.32)' }, { boxShadow: '0 0 0 5px rgba(124,111,240,0)' }],
    { duration: 420, easing: 'ease-out' }
  );
  try {
    navigator.vibrate?.(next === 'done' ? [18, 32, 26] : 14);
  } catch { /* vibration 並非所有手機都支援 */ }
}

function parseViewDirective(source) {
  const text = String(source || '').trim();
  if (!text) throw new Error('view directive 不可為空');
  let id;
  if (text.startsWith('{')) {
    const cfg = JSON.parse(text);
    if (Object.keys(cfg).some(k => !['id', 'view'].includes(k))) throw new Error('view directive 有未知欄位');
    id = cfg.id || cfg.view;
  } else id = text;
  if (!/^[a-z0-9][a-z0-9._-]*$/.test(id || '')) throw new Error('view id 無效');
  return { id };
}

function broadcastView(message) {
  for (const instance of viewInstances.values()) {
    instance.frame.contentWindow?.postMessage({ protocol: VIEW_PROTOCOL, ...message }, '*');
  }
}

function updateLocalActivityState(activityId, state, updatedAt = null) {
  if (unitData?.activities) {
    const activity = unitData.activities.find(a => a.id === activityId);
    if (activity) { activity.state = state; activity.updatedAt = updatedAt; }
  }
  document.querySelectorAll(`[data-activity-id="${CSS.escape(activityId)}"]`).forEach(el => {
    if (el.matches('select')) el.value = state;
    const card = el.closest('.activity-card');
    const dot = card?.querySelector('.activity-state-dot');
    if (dot) dot.className = `activity-state-dot st-${state}`;
  });
}

async function initView(instance) {
  try {
    courseActivitiesPromise ||= api(`api/v1/courses/${encodeURIComponent(course)}/activities`);
    const [payload, viewPayload] = await Promise.all([
      courseActivitiesPromise,
      api(`api/view-data?course=${encodeURIComponent(course)}&view=${encodeURIComponent(instance.definition.id)}`),
    ]);
    instance.activities = new Map(payload.activities.map(a => [a.id, a]));
    instance.shell.querySelector('.view-status').hidden = true;
    instance.frame.contentWindow.postMessage({
      protocol: VIEW_PROTOCOL,
      type: 'view:init',
      course,
      unit,
      surface: instance.surface,
      view: instance.definition,
      writable: payload.writable && !OFFLINE,
      revision: payload.revision,
      activities: payload.activities,
      data: viewPayload.data,
    }, '*');
  } catch (e) {
    instance.shell.classList.add('view-error');
    instance.shell.querySelector('.view-status').textContent = `View 載入失敗：${e.message}`;
  }
}

function mountView(definition, shell, surface = 'inline') {
  shell.innerHTML = `<div class="view-status dim">載入 ${esc(definition.title)}…</div>`;
  const frame = document.createElement('iframe');
  frame.className = 'course-view-frame';
  frame.title = definition.title;
  frame.setAttribute('sandbox', 'allow-scripts');
  if (surface === 'drawer') frame.style.height = '100%';
  else frame.style.height = `${definition.height || 720}px`;
  frame.src = `course-view/${encodeURIComponent(course)}/${encodeURIComponent(definition.id)}.html`;
  shell.appendChild(frame);
  const instance = { frame, shell, definition, surface, activities: new Map() };
  frame.addEventListener('load', () => {
    viewInstances.set(frame.contentWindow, instance);
    initView(instance);
  });
}

function setupCourseDrawer() {
  const definition = (unitData.views || []).find(v => v.id === unitData.courseDrawer);
  if (!definition) return;
  document.getElementById('courseViewToggle').hidden = false;
  document.getElementById('courseViewTitle').textContent = definition.title;
  const shell = document.createElement('div');
  shell.className = 'course-view-shell drawer';
  document.getElementById('courseViewHost').replaceChildren(shell);
  mountView(definition, shell, 'drawer');
}

function mountViews(root) {
  for (const code of root.querySelectorAll('pre > code.language-view')) {
    const pre = code.parentElement;
    try {
      const config = parseViewDirective(code.textContent);
      const definition = (unitData.views || []).find(v => v.id === config.id);
      if (!definition) throw new Error(`課程沒有宣告 view「${config.id}」`);
      const shell = document.createElement('div');
      shell.className = 'course-view-shell';
      pre.replaceWith(shell);
      mountView(definition, shell, 'inline');
    } catch (e) {
      const error = document.createElement('div');
      error.className = 'card view-error'; error.textContent = `View directive 無效：${e.message}`;
      pre.replaceWith(error);
    }
  }
}

window.addEventListener('message', async event => {
  const instance = viewInstances.get(event.source), message = event.data;
  if (!instance || !message || message.protocol !== VIEW_PROTOCOL || typeof message.type !== 'string') return;
  if (message.type === 'view:resize') {
    const height = Math.max(240, Math.min(1600, Number(message.height) || 0));
    if (height && instance.surface !== 'drawer') instance.frame.style.height = `${Math.ceil(height)}px`;
    return;
  }
  if (message.type === 'view:open-activity') {
    const activity = instance.activities.get(message.activityId);
    if (activity?.url) window.open(activity.url, '_blank', 'noopener');
    return;
  }
  if (message.type !== 'view:set-state') return;
  const requestId = message.requestId || null;
  try {
    if (OFFLINE || isArchived()) throw new Error(OFFLINE ? '目前離線' : '課程已封存');
    if (!['todo', 'doing', 'done'].includes(message.state)) throw new Error('state 無效');
    if (!instance.activities.has(message.activityId)) throw new Error('activity 不存在');
    const result = await api(`api/v1/courses/${encodeURIComponent(course)}/activities/${encodeURIComponent(message.activityId)}`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ state: message.state }),
    });
    for (const current of viewInstances.values()) {
      const activity = current.activities.get(message.activityId);
      if (activity) { activity.state = result.activity.state; activity.updatedAt = result.activity.updatedAt; }
    }
    updateLocalActivityState(message.activityId, result.activity.state, result.activity.updatedAt);
    broadcastView({ type: 'view:state', requestId, activityId: message.activityId,
      state: result.activity.state, updatedAt: result.activity.updatedAt });
  } catch (e) {
    instance.frame.contentWindow.postMessage({ protocol: VIEW_PROTOCOL, type: 'view:error', requestId,
      activityId: message.activityId, error: e.message }, '*');
  }
});

function renderStateButtons(state) {
  document.querySelectorAll('.unit-state-bar [data-state]').forEach(b => {
    b.classList.toggle('active', b.dataset.state === state);
    b.disabled = !!isArchived();
    b.onclick = async () => {
      if (OFFLINE || isArchived()) return;
      await api('api/progress', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ course, unit, state: b.dataset.state }) });
      renderStateButtons(b.dataset.state);
    };
  });
}

function setupNav() {
  const files = unitData.units.map(u => u.file);
  const i = files.indexOf(unit);
  const go = f => location.href = `reader.html?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(f)}`;
  const prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn');
  prev.disabled = i <= 0; next.disabled = i < 0 || i >= files.length - 1;
  prev.onclick = () => go(files[i-1]); next.onclick = () => go(files[i+1]);
}

// ---------- 本單元 Activity／任務 ----------
function renderActivities() {
  const host = document.getElementById('activities');
  const list = unitData.activities || [];
  if (!list.length) { host.innerHTML = ''; return; }
  const stateLabel = { todo: '未做', doing: '進行中', done: '完成' };
  const roleLabel = { anchor: 'Anchor', practice: '練習', extension: '延伸' };
  host.innerHTML = `<h2>本單元任務</h2><p class="dim">只記錄未做、進行中、完成三種狀態。</p>`;
  for (const a of list) {
    const card = document.createElement('div');
    card.className = 'activity-card';
    card.innerHTML = `<div class="activity-head">
      <span class="activity-state-dot st-${esc(a.state)}"></span>
      ${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener"><b>${esc(a.title)}</b> ↗</a>` : `<b>${esc(a.title)}</b>`}
      <span class="kw">${esc(roleLabel[a.role] || a.role)}</span>
      ${a.metadata && a.metadata.difficulty ? `<span class="kw">${esc(a.metadata.difficulty)}</span>` : ''}
      <span class="spacer"></span>
      <select class="activity-control activity-state" aria-label="任務狀態">
        ${Object.entries(stateLabel).map(([v,l]) => `<option value="${v}"${a.state === v ? ' selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>`;
    card.dataset.activityId = a.id;
    const state = card.querySelector('.activity-state');
    state.dataset.activityId = a.id;
    state.onchange = async () => {
      if (OFFLINE || isArchived()) return;
      state.disabled = true;
      try {
        const result = await api(`api/v1/courses/${encodeURIComponent(course)}/activities/${encodeURIComponent(a.id)}`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ state: state.value }) });
        a.state = result.activity.state;
        a.updatedAt = result.activity.updatedAt;
        for (const current of viewInstances.values()) {
          const activity = current.activities.get(a.id);
          if (activity) { activity.state = a.state; activity.updatedAt = a.updatedAt; }
        }
        updateLocalActivityState(a.id, a.state, a.updatedAt);
        broadcastView({ type: 'view:state', activityId: a.id, state: a.state, updatedAt: a.updatedAt });
      } catch (e) { state.value = a.state; alert('更新任務失敗：' + e.message); }
      state.disabled = false;
    };
    host.appendChild(card);
  }
  if (OFFLINE) applyOfflineUI();
  if (isArchived()) applyArchiveUI();
}

// ---------- 自答題 ----------
async function renderSelfcheck() {
  const el = document.getElementById('selfcheck');
  if (!unitData.questions.length) return;
  const attempts = await api(`api/selfcheck?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}`);
  el.innerHTML = '<h2>自答題(AI 批改)</h2><p class="dim">' + (isArchived()
    ? '這門課已封存，可查看歷次作答；還原後才能再次批改。'
    : '用自己的話、90 秒能講完的量。批改後才會顯示必含概念。') + '</p>';
  for (const q of unitData.questions) {
    const hist = attempts.filter(a => a.question_id === q.id);
    const last = hist[hist.length - 1];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div><b>${esc(q.question)}</b></div>
      ${last ? `<div class="dim">上次:<span class="verdict-${last.verdict}">${last.verdict === 'pass' ? '通過' : '回爐'}</span> · ${new Date(last.ts).toLocaleString('zh-TW')} · 共 ${hist.length} 次</div>` : ''}
      <textarea rows="4" placeholder="作答…"></textarea>
      <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
        <button class="primary">送出批改</button>
        ${hist.length ? '<button class="histBtn">歷次作答</button>' : ''}
        <span class="result dim"></span>
      </div>
      <div class="feedback"></div>`;
    const ta = card.querySelector('textarea');
    const btn = card.querySelector('button.primary');
    const result = card.querySelector('.result');
    const fb = card.querySelector('.feedback');
    btn.onclick = async () => {
      if (OFFLINE || isArchived() || !ta.value.trim()) return;
      btn.disabled = true; result.textContent = '批改中…(本機 claude,約 10-30 秒)'; result.className = 'result thinking';
      try {
        const g = await api('api/selfcheck', { method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ course, unit, qid: q.id, answer: ta.value }) });
        result.className = 'result';
        result.innerHTML = `<span class="verdict-${g.verdict}">${g.verdict === 'pass' ? '✔ 通過' : '↻ 回爐'}</span>`;
        fb.innerHTML = `<div class="card" style="margin-bottom:0">
          <div>${esc(g.feedback)}</div>
          ${g.missing && g.missing.length ? `<div class="dim" style="margin-top:6px">沒講到:${g.missing.map(esc).join('、')}</div>` : ''}
          <div style="margin-top:6px">必含概念:${g.keywords.map(k => `<span class="kw">${esc(k)}</span>`).join('')}</div>
        </div>`;
      } catch (e) { result.className = 'result'; result.textContent = '批改失敗:' + e.message; }
      btn.disabled = false;
    };
    const hb = card.querySelector('.histBtn');
    if (hb) hb.onclick = () => {
      fb.innerHTML = hist.map(a => `<div class="card" style="margin-bottom:6px">
        <div class="dim">${new Date(a.ts).toLocaleString('zh-TW')} · <span class="verdict-${a.verdict}">${a.verdict}</span></div>
        <div style="white-space:pre-wrap">${esc(a.answer)}</div>
        ${a.feedback ? `<div class="dim" style="margin-top:4px">${esc(a.feedback)}</div>` : ''}
      </div>`).join('');
    };
    el.appendChild(card);
  }
  if (OFFLINE) applyOfflineUI(); // 卡片長出來後補停用
  if (isArchived()) applyArchiveUI();
}

// ---------- 助教對話 ----------
const chatlog = document.getElementById('chatlog');
const panel = document.getElementById('chatpanel');
const coursePanel = document.getElementById('coursepanel');
const courseViewToggle = document.getElementById('courseViewToggle');
const chatToggle = document.getElementById('chatToggle');
function closeCoursePanel() {
  coursePanel.classList.add('collapsed');
  courseViewToggle.classList.remove('active');
}
function closeChatPanel() {
  panel.classList.add('collapsed');
  chatToggle.classList.remove('active');
  if (panel.classList.contains('full')) setFull(false);
}
courseViewToggle.onclick = () => {
  const opening = coursePanel.classList.contains('collapsed');
  if (opening) closeChatPanel();
  coursePanel.classList.toggle('collapsed', !opening);
  courseViewToggle.classList.toggle('active', opening);
};
document.getElementById('courseViewClose').onclick = closeCoursePanel;
chatToggle.onclick = () => {
  const opening = panel.classList.contains('collapsed');
  if (opening) closeCoursePanel();
  panel.classList.toggle('collapsed', !opening);
  chatToggle.classList.toggle('active', opening);
};
document.getElementById('chatClose').onclick = closeChatPanel;

// 全螢幕對話。上一/下一單元是整頁重新載入,狀態記在 localStorage 才不會每次都要重按。
const fullBtn = document.getElementById('chatFull');
function setFull(on) {
  panel.classList.toggle('full', on);
  fullBtn.textContent = on ? '⤡ 縮回' : '⤢ 全螢幕';
  try { localStorage.setItem('chatFull', on ? '1' : '0'); } catch {}
}
setFull((() => { try { return localStorage.getItem('chatFull') === '1'; } catch { return false; } })());
fullBtn.onclick = () => setFull(!panel.classList.contains('full'));
document.addEventListener('keydown', (e) => {
  // 全螢幕蓋住了 topbar,沒有 Esc 就只剩那顆縮回鈕可按
  if (e.key !== 'Escape') return;
  if (panel.classList.contains('full')) setFull(false);
  else if (!coursePanel.classList.contains('collapsed')) closeCoursePanel();
});

// 串流時只有「已經貼在底部」才跟著往下捲。
// 原本每個 delta 都無條件 scrollTop = scrollHeight,使用者往上翻去看前面幾段時
// 會被一直拉回底部,等於沒辦法邊讀邊等。往上滑就放手,滑回底部自動恢復跟隨。
let stick = true;
const atBottom = () => chatlog.scrollHeight - chatlog.scrollTop - chatlog.clientHeight < 40;
chatlog.addEventListener('scroll', () => { stick = atBottom(); });
const followBottom = () => { if (stick) chatlog.scrollTop = chatlog.scrollHeight; };
const jumpBottom = () => { stick = true; chatlog.scrollTop = chatlog.scrollHeight; };

// ---------- agent / 模型選擇 ----------
// 只有一個 agent 可用時整列隱藏:給假選擇比少一個選項糟。
// 選擇存 localStorage,因為上一/下一單元是整頁重新載入。
const chatBar = document.getElementById('chatBar');
const agentPick = document.getElementById('agentPick');
const modelPick = document.getElementById('modelPick');
const agentNote = document.getElementById('agentNote');
let AGENTS = [];

const savedPick = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const savePick = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

function curAgent() { return AGENTS.find(a => a.id === agentPick.value) || null; }

function renderModels() {
  const a = curAgent();
  const models = (a && a.models) || [];
  if (!models.length) {
    // 問不到清單(例如 pi --list-models 失敗)就不假裝能選
    modelPick.innerHTML = '<option>(由 agent 自己決定)</option>';
    modelPick.disabled = true;
  } else {
    // 偏好要分 agent 存,不然切 agent 會把 claude 的 model id 帶到 pi 去(對不上)
    const want = savedPick(`chatModel:${a.id}`, a.defaultModel);
    const opt = m => `<option value="${m.id}"${m.id === want ? ' selected' : ''}>${esc(m.label)}</option>`;
    // pi 有 20+ 個模型橫跨多個 provider,分組才找得到東西
    const groups = [];
    for (const m of models) {
      const g = m.provider || '';
      if (!groups.length || groups[groups.length - 1].g !== g) groups.push({ g, items: [] });
      groups[groups.length - 1].items.push(m);
    }
    modelPick.disabled = false;
    modelPick.innerHTML = groups.map(({ g, items }) => g
      ? `<optgroup label="${esc(g)}">${items.map(opt).join('')}</optgroup>`
      : items.map(opt).join('')).join('');
    modelPick.title = (models.find(m => m.id === modelPick.value) || {}).note || '選擇模型';
  }
  agentNote.textContent = (a && a.note) || '';
  agentNote.title = agentNote.textContent;
}

async function loadAgents() {
  try {
    AGENTS = (await api('api/agents')).filter(a => a.available);
  } catch { AGENTS = []; }
  // 只有一個 agent 又只有一個模型時,這一列沒有任何可選的東西,直接收掉
  const models0 = ((AGENTS[0] || {}).models || []).length;
  chatBar.hidden = AGENTS.length === 0 || (AGENTS.length === 1 && models0 < 2);
  const want = savedPick('chatAgent', 'claude');
  agentPick.innerHTML = AGENTS.map(a =>
    `<option value="${a.id}"${a.id === want ? ' selected' : ''}>${esc(a.label)}</option>`).join('');
  if (!agentPick.value && AGENTS[0]) agentPick.value = AGENTS[0].id;
  agentPick.disabled = AGENTS.length < 2;
  renderModels();
  applyArchiveUI();
}

agentPick.onchange = () => {
  savePick('chatAgent', agentPick.value);
  renderModels();
  // session 不能跨 agent 續聊,所以換 agent 一定是開新對話 —— 講清楚,
  // 不然使用者會以為助教突然失憶
  nextNewSession = true;
  curSession = null;         // 換 agent 一定是開新的一段
  sessNote.textContent = '';
  const a = curAgent();
  const d = document.createElement('div');
  d.className = 'msg switch';
  d.textContent = `── 已切換到 ${a ? a.label : agentPick.value},以下是新的一段對話 ──`;
  chatlog.appendChild(d);
  jumpBottom();
};
modelPick.onchange = () => {
  const a = curAgent();
  if (a) savePick(`chatModel:${a.id}`, modelPick.value);
  modelPick.title = ((a || {}).models || []).find(m => m.id === modelPick.value)?.note || '';
};

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<div class="who">${role === 'user' ? '你' : '助教'}</div><div class="bubble"></div>`;
  setMsgText(d, text, role);
  chatlog.appendChild(d);
  jumpBottom();   // 新訊息(送出/載入歷史)一律跳到底,這是使用者自己的動作
  return d;
}
function setMsgText(el, text, role) {
  const b = el.querySelector('.bubble');
  if (role === 'assistant') b.innerHTML = mdi.render(text);
  else b.textContent = text;
}

// ---------- 歷史對話 ----------
// chat_sessions 一直都存著每一段對話,但 /api/chat/history 以前只吐最新那段,
// 按過「＋新對話」或換過 agent 的舊紀錄就從 UI 消失了(DB 裡還在)。這裡把它們列出來。
const sessRow = document.getElementById('sessRow');
const sessPick = document.getElementById('sessPick');
const sessNote = document.getElementById('sessNote');
let latestSession = null;
let curSession = null;   // 目前在看/要續的那一段

const pad = n => String(n).padStart(2, '0');
const shortTs = iso => {
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};

function agentLabel(id) {
  const a = AGENTS.find(x => x.id === id);
  return a ? a.label : (id || '?');
}

function renderSessions(list, cur) {
  sessRow.hidden = list.length < 2;   // 只有一段就沒有「切換」的意義
  sessPick.innerHTML = list.map((s, i) => {
    const ask = (s.first_ask || '').replace(/\s+/g, ' ').slice(0, 18);
    const tail = i === 0 ? '(最新)' : '';
    return `<option value="${s.session_id}"${s.session_id === cur ? ' selected' : ''}>`
      + `${shortTs(s.created_at)} · ${agentLabel(s.agent)} · ${s.n} 則${tail} · ${esc(ask)}</option>`;
  }).join('');
}

// 舊對話可以直接續聊 —— 實測 claude --resume 接 5 天前 18 則的 session 沒問題,
// 30 段裡只有最舊 2 段的 session 檔已被 CLI 清掉;那種情況 driver 會自動退成
// 開新的一段並回報 resumeLost,不是硬錯。所以這裡只在離線時停用輸入框。
function setComposer() {
  const send = document.getElementById('chatSend');
  const ta = document.getElementById('chatText');
  if (OFFLINE) { applyOfflineUI(); return; }
  if (isArchived()) { applyArchiveUI(); return; }
  send.disabled = false; ta.disabled = false;
  ta.placeholder = '問這份講義的任何問題…(Enter 送出,Shift+Enter 換行)';
}

async function showSession(sessionId) {
  const qsp = `course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}`
    + (sessionId ? `&session=${encodeURIComponent(sessionId)}` : '');
  const h = await api(`api/chat/history?${qsp}`);
  latestSession = h.latest;
  chatlog.innerHTML = '';
  for (const m of h.messages) addMsg(m.role, m.content);
  renderSessions(h.sessions || [], h.sessionId);
  // 續聊的目標:使用者當下在看哪一段就續那一段(不再是一律續最新那段)
  curSession = h.sessionId || null;
  sessNote.textContent = (h.sessionId && h.sessionId !== h.latest) ? '接著這段聊' : '';
  setComposer();
  // 選單還原成這段對話當初用的設定,不然畫面顯示的 agent 跟實際續聊的會不一致
  if (h.agent && AGENTS.some(a => a.id === h.agent)) {
    agentPick.value = h.agent;
    renderModels();
    if (h.model) modelPick.value = h.model;
  }
  return h;
}

sessPick.onchange = () => showSession(sessPick.value).then(jumpBottom).catch(() => {});

/** 開新 session 後刷新清單(則數與最新那段都變了) */
async function refreshSessions() {
  try {
    const h = await api(`api/chat/history?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}`);
    latestSession = h.latest;
    renderSessions(h.sessions || [], h.latest);
  } catch {}
}

async function loadChatHistory() {
  try {
    const h = await showSession(null);
    // 手機上不自動展開,避免一進頁面就蓋住講義
    if (h.messages.length && window.matchMedia('(min-width: 821px)').matches) {
      panel.classList.remove('collapsed');
      jumpBottom();   // 收合中的元素量不到高度,捲不動;展開後才有辦法定位到最新一則
    }
  } catch {}
}

let sending = false;
let nextNewSession = false;
async function sendChat() {
  const ta = document.getElementById('chatText');
  const text = ta.value.trim();
  if (OFFLINE || isArchived() || !text || sending) return;
  const newSession = nextNewSession; nextNewSession = false;
  sending = true; ta.value = '';
  addMsg('user', text);
  const holder = addMsg('assistant', '');
  holder.querySelector('.bubble').innerHTML = '<span class="thinking">思考中…</span>';
  let acc = '';
  try {
    const r = await fetch('api/chat', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ course, unit, message: text, newSession,
        // 續「當下在看的那一段」,不是一律續最新那段
        session: newSession ? undefined : (curSession || undefined),
        agent: agentPick.value || undefined,
        model: modelPick.disabled ? undefined : modelPick.value }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const ev = (chunk.match(/^event: (.+)$/m) || [])[1];
        const dataLine = (chunk.match(/^data: (.+)$/m) || [])[1];
        if (!ev || !dataLine) continue;
        const data = JSON.parse(dataLine);
        if (ev === 'delta') { acc += data.text; setMsgText(holder, acc, 'assistant'); followBottom(); }
        if (ev === 'done') {
          setMsgText(holder, data.text || acc, 'assistant');
          curSession = data.sessionId || curSession;
          if (data.resumeLost) {
            // 想續的那段 session 檔已被 CLI 清掉,driver 退成開新的一段 ——
            // 講清楚,不然使用者只會覺得助教突然失憶
            const d = document.createElement('div');
            d.className = 'msg switch';
            d.textContent = '── 這段舊對話的 CLI session 已不存在,以上是新開的一段（講義 context 有,但沒有前面的問答）──';
            holder.before(d);
            refreshSessions();
          }
        }
        if (ev === 'error') { setMsgText(holder, '⚠ ' + data.error, 'assistant'); }
      }
    }
  } catch (e) { setMsgText(holder, '⚠ ' + e.message, 'assistant'); }
  sending = false;
  followBottom();
  // 開了新的一段就要刷清單:多一個選項,而且「最新」換人了
  if (newSession) refreshSessions();
}

document.getElementById('chatSend').onclick = () => sendChat();
document.getElementById('chatText').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
document.getElementById('newChat').onclick = () => {
  if (isArchived() || OFFLINE) return;
  chatlog.innerHTML = '';
  stick = true;
  nextNewSession = true;
  curSession = null;         // 開新的一段,不再續任何舊 session
  sessNote.textContent = '';
  const ta = document.getElementById('chatText');
  ta.placeholder = '新對話——第一則訊息會重新載入講義 context';
  ta.focus();
};

load().catch(e => { document.getElementById('md').textContent = '載入失敗:' + e.message; });
</script>
