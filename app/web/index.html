<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>學習中心</title>
<script src="/vendor/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --text: #172033; --muted: #6b7488;
    --line: rgba(100,112,134,.16); --accent: #4f46e5; --accent-soft: rgba(79,70,229,.09);
    --done: #059669; --done-soft: rgba(5,150,105,.12);
    --reading: #d97706; --reading-soft: rgba(217,119,6,.13);
    --redo: #dc2626;
    --seg-empty: rgba(100,112,134,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1020; --panel: #151a2c; --text: #eef2ff; --muted: #98a2bd;
      --line: rgba(168,178,202,.14); --accent: #818cf8; --accent-soft: rgba(129,140,248,.14);
      --done: #34d399; --done-soft: rgba(52,211,153,.14);
      --reading: #fbbf24; --reading-soft: rgba(251,191,36,.14);
      --redo: #f87171;
      --seg-empty: rgba(168,178,202,.16);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang TC", sans-serif; }
  main { width: min(640px, calc(100% - 40px)); margin: 0 auto; padding: 44px 0 64px; }
  main.wide { width: min(1100px, calc(100% - 40px)); }
  h1 { margin: 0 0 14px; font-size: 24px; letter-spacing: -.02em; }

  .hub-tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .hub-tab { font: inherit; font-size: 13.5px; font-weight: 650; background: none; border: 0;
    padding: 0 2px 9px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .hub-tab.on { color: var(--accent); border-bottom-color: var(--accent); }

  .overall { margin-bottom: 20px; }
  .overall-line { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted);
    margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .overall-line b { color: var(--text); font-size: 15px; font-weight: 700; }
  .overall-line .pct { margin-left: auto; }
  .overall-bar { height: 5px; border-radius: 3px; background: var(--seg-empty); overflow: hidden; display: flex; }
  .overall-bar .fd { background: var(--done); }
  .overall-bar .fr { background: var(--reading); }

  .panel-list { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); overflow: hidden; }

  .b-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 18px;
    background: none; border: 0; border-top: 1px solid var(--line); font: inherit; color: inherit;
    text-align: left; cursor: pointer; }
  .b-row:first-child { border-top: 0; }
  .b-row:hover { background: rgba(127,127,127,.05); }
  .b-main { flex: 1; min-width: 0; }
  .b-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .b-next { display: block; font-size: 12px; color: var(--muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-next .nx { color: var(--accent); font-weight: 650; }
  .b-next .nx-done { color: var(--done); font-weight: 650; }
  .mini-track { display: flex; gap: 2.5px; width: 86px; flex: none; }
  .seg { height: 5px; border-radius: 2px; background: var(--seg-empty); flex: 1; }
  .seg.s-done { background: var(--done); }
  .seg.s-reading { background: var(--reading); }
  .b-count { flex: none; width: 42px; text-align: right; font-size: 12.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .b-count b { color: var(--text); font-weight: 700; }
  .arrow { color: var(--muted); flex: none; }
  .b-row:hover .arrow { color: var(--accent); }
  @media (max-width: 480px) { .mini-track { display: none; } }

  .back { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px;
    color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer;
    margin-bottom: 14px; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .detail-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .detail-head h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; flex: 1; min-width: 0; }
  .detail-count { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .detail-count b { color: var(--text); }
  .detail-meta { display: flex; align-items: center; gap: 14px; margin-top: 2px; flex-wrap: wrap; }
  .last-read { font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .detail-track { display: flex; gap: 4px; margin: 14px 0 16px; }
  .detail-track .seg { height: 6px; border-radius: 3px; }

  .units { list-style: none; margin: 0; padding: 4px 18px; }
  .unit { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .unit:first-child { border-top: 0; }
  .u-no { flex: none; width: 20px; font-size: 11.5px; color: var(--muted); text-align: right;
    font-variant-numeric: tabular-nums; }
  .u-title { flex: 1; min-width: 0; font-size: 13.5px; text-decoration: none; color: inherit;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .u-title:hover { color: var(--accent); }
  .u-title.is-done { color: var(--muted); }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 5px; font: inherit;
    font-size: 11px; font-weight: 650; border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 9px; background: transparent; color: var(--muted); cursor: pointer;
    min-width: 68px; justify-content: center; }
  .chip:hover { border-color: var(--accent); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .55; }
  .chip.st-reading { color: var(--reading); background: var(--reading-soft); border-color: transparent; }
  .chip.st-done { color: var(--done); background: var(--done-soft); border-color: transparent; }

  h3.sec { font-size: 13px; color: var(--muted); margin: 26px 0 10px; font-weight: 650; }
  .rec { font-size: 12.5px; padding: 7px 18px; border-top: 1px solid var(--line); color: var(--muted); }
  .rec:first-child { border-top: 0; }
  .rec b { color: var(--text); font-weight: 650; }
  .rec a { color: var(--accent); text-decoration: none; }
  .rec a:hover { text-decoration: underline; }
  .redo-badge { color: var(--redo); font-weight: 700; }
  .empty { padding: 14px 18px; font-size: 12.5px; color: var(--muted); }

  .cy-wrap { position: relative; }
  #cy { height: calc(100vh - 220px); min-height: 460px; border: 1px solid var(--line);
    border-radius: 16px; background: var(--panel); }
  .cy-tip {
    position: absolute; z-index: 20; max-width: 280px; pointer-events: none;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; font-size: 12.5px; line-height: 1.55;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); opacity: 0; transition: opacity .12s ease;
  }
  .cy-tip.show { opacity: 1; }
  .cy-tip b { font-size: 12px; }
  .cy-tip .why { color: var(--muted); margin-top: 2px; }
  .graph-hint { font-size: 12px; color: var(--muted); margin: 8px 2px 0; }

  .error { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; color: var(--muted); font-size: 13px; }
  footer { margin-top: 20px; color: var(--muted); font-size: 12px; text-align: right; }
</style>
</head>
<body>
<main id="main">
  <h1>學習中心</h1>
  <div id="view"></div>
  <footer id="foot"></footer>
</main>

<script>
const CYCLE = { unread: 'reading', reading: 'done', done: 'unread' };
const LABEL = { unread: '未讀', reading: '閱讀中', done: '已讀' };
const KIND = { read: '閱讀', selfcheck: '自答', chat: '對話', lab: 'Lab' };

let COURSES = [], RECORDS = [], REDO = [];
let GRAPH = { edges: [] }; // /api/graph 的合併邊(手動 + 自動候選)
let cy = null; // 圖譜 lazy init

const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c]));
const readerUrl = (c, u) => `/reader.html?course=${encodeURIComponent(c)}&unit=${encodeURIComponent(u)}`;
const ago = iso => {
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
  return d <= 0 ? '今天' : d === 1 ? '昨天' : d + ' 天前';
};
const nextUnit = c => c.units.find(u => u.state !== 'done') || null;

function route() {
  const h = location.hash;
  if (h.startsWith('#/c/')) return { page: 'detail', slug: decodeURIComponent(h.slice(4)) };
  if (h === '#/graph') return { page: 'graph' };
  return { page: 'overview' };
}

function tabsHTML(cur) {
  return `<div class="hub-tabs">
    <button class="hub-tab ${cur === 'progress' ? 'on' : ''}" data-nav="">課程</button>
    <button class="hub-tab ${cur === 'graph' ? 'on' : ''}" data-nav="#/graph">圖譜</button>
  </div>`;
}

function overallHTML() {
  let done = 0, reading = 0, total = 0;
  COURSES.forEach(c => c.units.forEach(u => {
    total++;
    if (u.state === 'done') done++; else if (u.state === 'reading') reading++;
  }));
  if (!total) return '';
  return `<div class="overall">
    <div class="overall-line"><b>${done} / ${total}</b> units 已讀${reading ? ` · ${reading} 閱讀中` : ''}<span class="pct">${Math.round(done / total * 100)}%</span></div>
    <div class="overall-bar"><div class="fd" style="width:${done / total * 100}%"></div><div class="fr" style="width:${reading / total * 100}%"></div></div>
  </div>`;
}

function overviewHTML() {
  const lastTouch = c => c.units.reduce((m, u) => (u.updatedAt && u.updatedAt > m ? u.updatedAt : m), '');
  const ordered = [...COURSES].sort((a, b) => lastTouch(b).localeCompare(lastTouch(a)));
  const rows = ordered.map(c => {
    const nx = nextUnit(c);
    const nextLine = nx
      ? `下一個:<span class="nx">${esc(nx.title.replace(/ ——.*$/, ''))}</span>`
      : `<span class="nx-done">全部讀完 ✓</span>`;
    return `<button class="b-row" data-course="${esc(c.slug)}">
      <span class="b-main">
        <span class="b-name">${esc(c.title)}</span>
        <span class="b-next">${nextLine}</span>
      </span>
      <span class="mini-track">${c.units.map(u => `<span class="seg s-${u.state}"></span>`).join('')}</span>
      <span class="b-count"><b>${c.done}</b>/${c.total}</span>
      <span class="arrow">→</span>
    </button>`;
  }).join('');

  const redoRows = REDO.map(r =>
    `<div class="rec"><span class="redo-badge">↻</span> <b>${esc(courseTitle(r.course))}</b> · ${esc(r.unit.replace('.md',''))} · ${esc(r.question_id)}
     <a href="${readerUrl(r.course, r.unit)}">去重答 →</a></div>`).join('');

  const recRows = RECORDS.map(r =>
    `<div class="rec">${new Date(r.ts).toLocaleString('zh-TW', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
     · <b>${esc(courseTitle(r.course))}</b>${r.unit ? ' · ' + esc(r.unit.replace('.md','')) : ''}
     · ${KIND[r.kind] || esc(r.kind)}${r.note ? ' — ' + esc(r.note) : ''}</div>`).join('');

  return tabsHTML('progress') + overallHTML()
    + `<div class="panel-list">${rows || '<div class="empty">還沒有課程——在專案裡跑 /new-course 開一門</div>'}</div>`
    + (REDO.length ? `<h3 class="sec">待回爐</h3><div class="panel-list">${redoRows}</div>` : '')
    + `<h3 class="sec">最近學習記錄</h3><div class="panel-list">${recRows || '<div class="empty">尚無記錄</div>'}</div>`;
}

function courseTitle(slug) {
  const c = COURSES.find(x => x.slug === slug);
  return c ? c.title : slug;
}

function detailHTML(slug) {
  const c = COURSES.find(x => x.slug === slug);
  if (!c) return overviewHTML();
  const times = c.units.map(u => u.updatedAt).filter(Boolean);
  const last = times.length ? `上次閱讀:${ago(times.sort().at(-1))}` : '尚未開始';
  const rows = c.units.map((u, i) => `<li class="unit">
    <span class="u-no">${i + 1}</span>
    <a class="u-title ${u.state === 'done' ? 'is-done' : ''}" href="${readerUrl(c.slug, u.file)}">${esc(u.title)}</a>
    <button class="chip st-${u.state}" data-c="${esc(c.slug)}" data-u="${esc(u.file)}" type="button"><span class="dot"></span>${LABEL[u.state]}</button>
  </li>`).join('');
  return `<a class="back" href="#">← 全部課程</a>
    <div class="detail-head"><h2>${esc(c.title)}</h2><span class="detail-count"><b>${c.done}</b> / ${c.total} 已讀</span></div>
    <div class="detail-meta">
      <span class="last-read">${last}</span>
      ${(c.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
    </div>
    <div class="detail-track">${c.units.map(u => `<div class="seg s-${u.state}"></div>`).join('')}</div>
    <div class="panel-list"><ul class="units">${rows}</ul></div>`;
}

function graphHTML() {
  return tabsHTML('graph') + `<div class="cy-wrap"><div id="cy"></div><div class="cy-tip" id="cyTip"></div></div>
    <div class="graph-hint">虛線 = 相關(概念比對自動生成)、實線箭頭 = 先修(prereq,手動標註)。點課程節點展開/收合單元;點單元進講義;滑過連線看概念呼應。</div>`;
}

// ---------- 圖譜 ----------
const STATE_COLOR = { unread: '#8b93a7', reading: '#d97706', done: '#059669' };

function initGraph() {
  const container = document.getElementById('cy');
  if (!container) return;
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const text = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  const panel = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();

  const elements = [];
  for (const c of COURSES) {
    elements.push({ data: { id: c.slug, label: `${c.title}\n${c.done}/${c.total}`, kind: 'course',
      size: 50 + c.total * 3, pct: c.total ? c.done / c.total : 0 } });
  }
  for (const e of (GRAPH.edges || [])) {
    elements.push({ data: { id: `${e.source}->${e.target}`, source: e.source, target: e.target,
      type: e.type || 'related', why: e.why || '', kind: 'rel',
      origin: e.origin || 'manual', score: e.score || 0,
      evidence: (e.evidence || []).map(v => `${v.from} ↔ ${v.to}`).join('、') } });
  }

  cy = cytoscape({
    container, elements,
    style: [
      { selector: 'node[kind="course"]', style: {
        'label': 'data(label)', 'text-wrap': 'wrap', 'text-valign': 'center', 'color': text,
        'font-size': 12, 'font-weight': 600,
        'width': 'data(size)', 'height': 'data(size)',
        'background-color': panel, 'border-width': 4, 'border-color': accent,
        'pie-size': '92%',
        'pie-1-background-color': '#059669',
        'pie-1-background-size': 'mapData(pct, 0, 1, 0, 100)',
        'pie-1-background-opacity': 0.25,
      }},
      { selector: 'node[kind="unit"]', style: {
        'label': 'data(label)', 'text-wrap': 'wrap', 'text-max-width': 140, 'font-size': 10,
        'color': text, 'text-valign': 'bottom', 'text-margin-y': 4, 'text-opacity': .8,
        'width': 16, 'height': 16, 'background-color': 'data(color)',
      }},
      { selector: 'edge[kind="rel"]', style: {
        'width': 2, 'line-color': '#4fb3bf', 'line-style': 'dashed', 'curve-style': 'bezier', 'opacity': .8,
      }},
      { selector: 'edge[kind="rel"][type="prereq"]', style: {
        'line-style': 'solid', 'line-color': accent, 'target-arrow-shape': 'triangle', 'target-arrow-color': accent,
      }},
      { selector: 'edge[kind="unitlink"]', style: { 'width': 1, 'line-color': 'rgba(127,127,127,.35)', 'curve-style': 'bezier' } },
    ],
    layout: { name: 'cose', animate: false, padding: 60 },
    wheelSensitivity: 0.2,
  });

  const expanded = new Set();
  cy.on('tap', 'node[kind="course"]', (ev) => {
    const id = ev.target.id();
    if (expanded.has(id)) {
      cy.remove(cy.elements(`[parentCourse="${id}"]`));
      expanded.delete(id);
      return;
    }
    const c = COURSES.find(x => x.slug === id);
    const eles = [];
    c.units.forEach((u) => {
      const uid = `${id}::${u.file}`;
      eles.push({ data: { id: uid, label: u.title.replace(/^Unit \d+[::]\s*/, '').replace(/ ——.*$/, ''),
        kind: 'unit', color: STATE_COLOR[u.state] || STATE_COLOR.unread,
        parentCourse: id, course: id, file: u.file } });
      eles.push({ data: { id: `${uid}-e`, source: id, target: uid, kind: 'unitlink', parentCourse: id } });
    });
    cy.add(eles);
    cy.layout({ name: 'cose', animate: true, animationDuration: 400, padding: 60, randomize: false }).run();
    expanded.add(id);
  });
  cy.on('tap', 'node[kind="unit"]', (ev) => {
    const d = ev.target.data();
    location.href = readerUrl(d.course, d.file);
  });
  // 關聯線 tooltip:hover 顯示(觸控裝置用 tap 切換)
  const tip = document.getElementById('cyTip');
  const TYPE_LABEL = { prereq: '先修', related: '相關', extends: '深入' };
  function showTip(ev) {
    const d = ev.target.data();
    const badge = (TYPE_LABEL[d.type] || esc(d.type)) + (d.score ? ` · 相似度 ${Number(d.score).toFixed(3)}` : '');
    tip.innerHTML = `<b>${esc(courseTitle(d.source))} ${d.type === 'prereq' ? '→' : '↔'} ${esc(courseTitle(d.target))}</b>
      <span class="dim">(${badge})</span>
      ${d.why ? `<div class="why">${esc(d.why)}</div>` : ''}`;
    const pos = ev.renderedPosition || (ev.target.midpoint && { x: ev.target.renderedMidpoint().x, y: ev.target.renderedMidpoint().y });
    const wrap = container.getBoundingClientRect();
    let x = (pos ? pos.x : wrap.width / 2) + 14;
    let y = (pos ? pos.y : wrap.height / 2) + 14;
    tip.classList.add('show');
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > wrap.width - 8) x = Math.max(8, x - tw - 28);
    if (y + th > wrap.height - 8) y = Math.max(8, y - th - 28);
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
  const hideTip = () => tip.classList.remove('show');
  cy.on('mouseover', 'edge[kind="rel"]', showTip);
  cy.on('mousemove', 'edge[kind="rel"]', showTip);
  cy.on('mouseout', 'edge[kind="rel"]', hideTip);
  cy.on('tap', 'edge[kind="rel"]', (ev) => tip.classList.contains('show') ? hideTip() : showTip(ev));
  cy.on('tap', (ev) => { if (ev.target === cy) hideTip(); }); // 點空白處關掉
  cy.on('pan zoom', hideTip);
}

// ---------- render / events ----------
function render() {
  const r = route();
  cy = null; // 換頁就丟掉舊實例
  document.getElementById('main').classList.toggle('wide', r.page === 'graph');
  document.getElementById('view').innerHTML =
    r.page === 'detail' ? detailHTML(r.slug)
    : r.page === 'graph' ? graphHTML()
    : overviewHTML();
  if (r.page === 'graph') initGraph();
  const totalUnits = COURSES.reduce((n, c) => n + c.total, 0);
  document.getElementById('foot').textContent =
    COURSES.length ? `${COURSES.length} courses · ${totalUnits} units` : '';
}

async function load() {
  try {
    const [c, rec, redo, g] = await Promise.all([
      fetch('/api/courses', { cache: 'no-store' }).then(r => r.json()),
      fetch('/api/records?limit=10', { cache: 'no-store' }).then(r => r.json()),
      fetch('/api/redo', { cache: 'no-store' }).then(r => r.json()),
      fetch('/api/graph', { cache: 'no-store' }).then(r => r.json()),
    ]);
    COURSES = c; RECORDS = rec; REDO = redo; GRAPH = g;
    render();
  } catch (e) {
    document.getElementById('view').innerHTML =
      `<div class="error">讀不到課程資料(${esc(e.message)})。確認 learning-hub 服務有起來。</div>`;
  }
}

window.addEventListener('hashchange', () => load()); // 切頁順便重抓資料,避免顯示舊狀態
window.addEventListener('pageshow', (e) => { if (e.persisted) load(); }); // 從 bfcache 返回也重抓

document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    const h = nav.dataset.nav;
    if (h) location.hash = h;
    else { history.pushState('', '', location.pathname + location.search); render(); }
    return;
  }
  const row = e.target.closest('[data-course]');
  if (row) { location.hash = '#/c/' + row.dataset.course; return; }
  const chip = e.target.closest('.chip');
  if (chip) {
    const slug = chip.dataset.c, file = chip.dataset.u;
    const course = COURSES.find(x => x.slug === slug);
    const u = course && course.units.find(x => x.file === file);
    if (!u) return;
    const nextState = CYCLE[u.state];
    chip.disabled = true;
    try {
      const r = await fetch('/api/progress', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ course: slug, unit: file, state: nextState }) });
      if (!r.ok) throw new Error(r.status);
      u.state = nextState;
      u.updatedAt = new Date().toISOString();
      course.done = course.units.filter(x => x.state === 'done').length;
      render();
    } catch {
      chip.disabled = false;
      alert('狀態存檔失敗,再點一次試試。');
    }
    return;
  }
  const back = e.target.closest('.back');
  if (back) {
    e.preventDefault();
    history.pushState('', '', location.pathname + location.search);
    render();
  }
});

load();
</script>
</body>
</html>
