<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vector 關聯 Demo</title>
<script src="/vendor/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --text: #172033; --muted: #6b7488;
    --line: rgba(100,112,134,.16); --accent: #4f46e5; --done: #059669; --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c1020; --panel: #151a2c; --text: #eef2ff; --muted: #98a2bd;
      --line: rgba(168,178,202,.14); --accent: #818cf8; --done: #34d399; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang TC", sans-serif; }
  main { width: min(1200px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .grid { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  #cy { flex: 1; min-width: 480px; height: 620px; border: 1px solid var(--line);
    border-radius: 16px; background: var(--panel); }
  aside { width: 380px; flex-shrink: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px; margin-bottom: 14px; font-size: 13px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  td { padding: 3px 6px; border-top: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .hi { color: var(--done); }
  .lo { color: var(--muted); }
  .legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-block; margin-right: 14px; }
  .bar { display: inline-block; width: 26px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<main>
  <h1>Vector 關聯 Demo</h1>
  <div class="sub" id="meta">載入中…</div>
  <div class="grid">
    <div id="cy"></div>
    <aside>
      <div class="card">
        <h3>課程相似度全配對(bge-m3 cosine)</h3>
        <table id="simTable"></table>
        <div class="legend">
          <span><i class="bar" style="background:var(--done)"></i>候選邊(相對排名 + margin 過門檻)</span>
          <span><i class="bar" style="background:var(--line)"></i>低於門檻</span>
        </div>
      </div>
      <div class="card">
        <h3>跨課單元 Top 配對(點圖上虛線同步)</h3>
        <table id="unitTable"></table>
      </div>
    </aside>
  </div>
</main>

<script>
const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c]));

async function main() {
  const d = await fetch('/relations-demo.json').then(r => r.json());
  document.getElementById('meta').textContent =
    `模型 ${d.model} · ${d.courses.length} 門課 · 產生於 ${new Date(d.generatedAt).toLocaleString('zh-TW')} · 邊粗細/不透明度 = 相似度`;

  const edgeKeys = new Set(d.courseEdges.map(e => e.a + '|' + e.b));

  // ---- 側欄表 ----
  document.getElementById('simTable').innerHTML = d.courseSims.map(e => {
    const isEdge = edgeKeys.has(e.a + '|' + e.b);
    return `<tr><td class="${isEdge ? 'hi' : 'lo'}">${esc(e.a)} ↔ ${esc(e.b)}</td>
      <td class="num ${isEdge ? 'hi' : 'lo'}">${e.sim.toFixed(3)}</td></tr>`;
  }).join('');

  document.getElementById('unitTable').innerHTML = d.unitEdges.slice(0, 10).map(e =>
    `<tr><td>${esc(e.a.title.replace(/ ——.*/, ''))}<br><span class="lo">↔ ${esc(e.b.title.replace(/ ——.*/, ''))}</span></td>
     <td class="num">${e.sim.toFixed(3)}</td></tr>`
  ).join('');

  // ---- 圖 ----
  const text = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  const panel = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

  const elements = [];
  for (const c of d.courses) {
    elements.push({ data: { id: c.slug, label: c.title, kind: 'course' } });
  }
  // 課程邊:全矩陣都畫,視覺強度 = 相似度;候選邊上色
  for (const e of d.courseSims) {
    const isEdge = edgeKeys.has(e.a + '|' + e.b);
    elements.push({ data: { id: `c:${e.a}|${e.b}`, source: e.a, target: e.b, kind: 'course-sim',
      sim: e.sim, label: e.sim.toFixed(2), strong: isEdge ? 1 : 0 } });
  }
  // 單元節點與邊(top 10)
  const unitSeen = new Set();
  for (const e of d.unitEdges.slice(0, 10)) {
    for (const u of [e.a, e.b]) {
      const uid = u.slug + '::' + u.file;
      if (!unitSeen.has(uid)) {
        unitSeen.add(uid);
        elements.push({ data: { id: uid, label: u.title.replace(/ ——.*/, '').replace(/^Unit /, 'U'), kind: 'unit', course: u.slug } });
        elements.push({ data: { id: uid + '-anchor', source: u.slug, target: uid, kind: 'anchor' } });
      }
    }
    elements.push({ data: { id: `u:${e.a.slug}${e.a.file}|${e.b.slug}${e.b.file}`,
      source: e.a.slug + '::' + e.a.file, target: e.b.slug + '::' + e.b.file,
      kind: 'unit-sim', sim: e.sim, label: e.sim.toFixed(2) } });
  }

  cytoscape({
    container: document.getElementById('cy'),
    elements,
    style: [
      { selector: 'node[kind="course"]', style: {
        label: 'data(label)', 'text-wrap': 'wrap', 'text-valign': 'center', color: text,
        'font-size': 13, 'font-weight': 700, width: 88, height: 88,
        'background-color': panel, 'border-width': 4, 'border-color': accent,
      }},
      { selector: 'node[kind="unit"]', style: {
        label: 'data(label)', 'text-wrap': 'wrap', 'text-max-width': 110, 'font-size': 9.5,
        color: text, 'text-valign': 'bottom', 'text-margin-y': 3, 'text-opacity': .85,
        width: 14, height: 14, 'background-color': '#d97706',
      }},
      { selector: 'edge[kind="course-sim"]', style: {
        'curve-style': 'bezier', label: 'data(label)', 'font-size': 10, color: text,
        'text-background-color': panel, 'text-background-opacity': .8, 'text-background-padding': 2,
        width: 'mapData(sim, 0.55, 0.8, 1, 7)',
        'line-color': accent,
        opacity: 'mapData(sim, 0.55, 0.8, 0.12, 0.95)',
      }},
      { selector: 'edge[kind="course-sim"][strong=0]', style: { 'line-style': 'dotted', color: 'rgba(127,127,127,.8)' } },
      { selector: 'edge[kind="unit-sim"]', style: {
        'curve-style': 'bezier', 'line-style': 'dashed', 'line-color': '#d97706',
        width: 'mapData(sim, 0.6, 0.85, 1, 4)', opacity: .8,
        label: 'data(label)', 'font-size': 9, color: '#d97706',
        'text-background-color': panel, 'text-background-opacity': .8,
      }},
      { selector: 'edge[kind="anchor"]', style: { width: 1, 'line-color': 'rgba(127,127,127,.25)', 'curve-style': 'bezier' } },
    ],
    layout: { name: 'cose', animate: false, padding: 50, nodeRepulsion: 12000 },
    wheelSensitivity: 0.2,
  });
}
main();
</script>
</body>
</html>
